<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpicHigh Community</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/community.css" />
  </head>
  <body>
    <header>
      <div id="header-container"></div>
    </header>
    <main>
      <section>
        <h1 class="community--border--mainimg">High Skool Community</h1>
      </section>
      <section class="community--post-container">
        <div class="community--user--border">
          <div class="user--border--title">
            <h2>love love love 노래방 힙합 순위</h2>
          </div>
          <div class="user--border--detail">
            <img src="/images/community/love.jpg" />
            <br /><br />2위 <br /><br /><br />
          </div>
        </div>

        <div class="community--user--comment">
          <table class="community--user--comment--list">
            <tr>
              <td>가나다</td>
              <td>붕붕 옛날 노래도 아닌데 아직도 저순위네</td>
              <td>02.10 16:12:30</td>
            </tr>
            <tr>
              <td>머쓰마</td>
              <td>쇼 미에 김하온 나와서 순위높은건가</td>
              <td>02.10 18:02:19</td>
            </tr>
            <tr>
              <td>E펜</td>
              <td>노래방에서는 다듀가 짱이긴하구나</td>
              <td>02.10 18:07:11</td>
            </tr>
          </table>
        </div>
      </section>
      <section>
        <div class="community--comentbar">
          <input
            class="community--comentbar--input"
            placeholder="인터넷은 개인의 것이 아닙니다. 바르고 고운말을 사용해 주세요."
          />
          <button class="community--comentbar--btn">등록</button>
        </div>
      </section>
    </main>
    <footer>
      <div id="footer-container"></div>
    </footer>
  </body>
  <script>
    fetch("header.html")
      .then((res) => res.text())
      .then((data) => {
        document.getElementById("header-container").innerHTML = data;
      });

    fetch("footer.html")
      .then((res) => res.text())
      .then((data) => {
        document.getElementById("footer-container").innerHTML = data;
      });
  </script>
</html>
