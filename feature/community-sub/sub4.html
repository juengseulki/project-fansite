<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPIK HIGH | Community</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/community.css" />
  </head>
  <body>
    <header>
      <div id="header-container"></div>
    </header>
    <main>
      <section>
        <h1 class="community--border--mainimg">High Skool Community</h1>
      </section>
      <section class="community--post-container">
        <div class="community--user--border">
          <div class="user--border--title">
            <h2>킹픽하이</h2>
          </div>
          <div class="user--border--detail">
            <br /><br />버스 타고 멀리갈때 듣기 좋은 음악 GOAT<br /><br /><br />
          </div>
        </div>

        <div class="community--user--comment">
          <table class="community--user--comment--list"></table>
        </div>
      </section>
      <section>
        <div class="community--comentbar">
          <input
            class="community--comentbar--input"
            placeholder="인터넷은 개인의 것이 아닙니다. 바르고 고운말을 사용해 주세요."
          />
          <button class="community--comentbar--btn">등록</button>
        </div>
      </section>
    </main>
    <footer>
      <div id="footer-container"></div>
    </footer>
  </body>
  <script>
    fetch("/feature/header.html")
      .then((res) => res.text())
      .then((data) => {
        document.getElementById("header-container").innerHTML = data;
      });

    fetch("/feature/footer.html")
      .then((res) => res.text())
      .then((data) => {
        document.getElementById("footer-container").innerHTML = data;
      });
  </script>
</html>
