<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpicHigh Community</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/fan-letter.css" />
  </head>
  <body>
    <header>
      <div id="header-container"></div>
    </header>
    <main>
      <section>
        <h1 class="community--border--mainimg">High Skool Fan-letter</h1>
      </section>
      <section>
        <div>
          <form name="send--fan--letter">
            <p class="fan--form--title">보낼 사람</p>

            <div class="fanletter--selection-container">
              <label class="fanletter--item">
                <img src="/images/community/타블로.png" alt="타블로" />
                <div class="input-group">
                  <input
                    type="checkbox"
                    name="receiver"
                    value="타블로"
                    id="fanletter--epichigh1"
                  />
                  <p>타블로</p>
                </div>
              </label>

              <label class="fanletter--item">
                <img src="/images/community/투컷.png" alt="투컷" />
                <div class="input-group">
                  <input
                    type="checkbox"
                    name="receiver"
                    value="투컷"
                    id="fanletter--epichigh2"
                  />
                  <p>투컷</p>
                </div>
              </label>

              <label class="fanletter--item">
                <img src="/images/community/미쓰라.png" alt="미쓰라" />
                <div class="input-group">
                  <input
                    type="checkbox"
                    name="receiver"
                    value="미쓰라"
                    id="fanletter--epichigh3"
                  />
                  <p>미쓰라</p>
                </div>
              </label>
            </div>

            <div class="fan--form--inputs">
              <p>이름</p>
              <input type="text" placeholder="이름을 입력해주세요" />

              <p>이메일</p>
              <input type="email" placeholder="이메일을 입력해주세요" />

              <p>메시지</p>
              <textarea placeholder="전달할 말을 입력해주세요"></textarea>

              <br />
              <input type="file" id="fan-photo" style="display: none" />

              <label for="fan-photo" class="custom-file-upload">
                이미지 업로드
              </label>
              <input
                type="submit"
                value="팬레터 보내기"
                onclick="alert('팬레터가 성공적으로 전송되었습니다!');"
              />
            </div>
          </form>
        </div>
      </section>
    </main>
    <footer>
      <div id="footer-container"></div>
    </footer>
  </body>
  <script>
    fetch("header.html")
      .then((res) => res.text())
      .then((data) => {
        document.getElementById("header-container").innerHTML = data;
      });

    fetch("footer.html")
      .then((res) => res.text())
      .then((data) => {
        document.getElementById("footer-container").innerHTML = data;
      });
  </script>
</html>
